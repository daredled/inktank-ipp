[project]
name = "inktank"
version = "0.1.0"
description = "Experimental HP Ink Tank 315 driver (PCL3GUI) with a network print service"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.14"
dependencies = [
    "aiohttp>=3.14.5",
    "numpy>=2.0",
    "pillow>=10.4",
    "zeroconf>=0.151.5",
]

[project.scripts]
inktank = "inktank.__main__:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
